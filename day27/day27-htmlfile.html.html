<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prior Authorization Story Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --blue-50: #E6F1FB; --blue-100: #B5D4F4; --blue-200: #85B7EB;
    --blue-400: #378ADD; --blue-600: #185FA5; --blue-800: #0C447C; --blue-900: #042C53;
    --green-50: #EAF3DE; --green-100: #C0DD97; --green-400: #639922;
    --green-600: #3B6D11; --green-800: #27500A;
    --amber-50: #FAEEDA; --amber-100: #FAC775; --amber-400: #BA7517;
    --amber-600: #854F0B; --amber-800: #633806;
    --red-50: #FCEBEB; --red-100: #F7C1C1; --red-400: #E24B4A;
    --red-600: #A32D2D; --red-800: #791F1F;
    --purple-50: #EEEDFE; --purple-100: #CECBF6; --purple-400: #7F77DD;
    --purple-600: #534AB7; --purple-800: #3C3489;
    --teal-50: #E1F5EE; --teal-100: #9FE1CB; --teal-400: #1D9E75;
    --teal-600: #0F6E56; --teal-800: #085041;
    --gray-50: #F1EFE8; --gray-100: #D3D1C7; --gray-200: #B4B2A9;
    --gray-400: #888780; --gray-600: #5F5E5A; --gray-800: #444441; --gray-900: #2C2C2A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8f7f4;
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--blue-900);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.1px;
  }

  .header-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-top: 1px;
  }

  /* ── PROGRESS BAR ── */
  .progress-track {
    background: rgba(255,255,255,0.1);
    height: 3px;
    border-radius: 2px;
    overflow: hidden;
    width: 160px;
  }

  .progress-fill {
    height: 100%;
    background: var(--blue-200);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* ── SCENE LABEL ── */
  .scene-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--blue-800);
    background: var(--blue-50);
    border: 0.5px solid var(--blue-100);
    border-radius: 20px;
    padding: 3px 10px;
    width: fit-content;
    margin: 0 auto 12px;
  }

  /* ── NARRATOR ── */
  .narrator {
    text-align: center;
    font-style: italic;
    font-size: 13px;
    color: var(--gray-600);
    margin: 8px 40px;
    line-height: 1.6;
    padding: 10px 16px;
    border-left: 2px solid var(--gray-200);
    border-right: 2px solid var(--gray-200);
    background: #fff;
    border-radius: 8px;
  }

  /* ── CHAT BUBBLES ── */
  .bubble-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin: 4px 0;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble-row.left  { flex-direction: row;         padding-left: 8px; }
  .bubble-row.right { flex-direction: row-reverse;  padding-right: 8px; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 1.5px solid rgba(0,0,0,0.06);
    background: #fff;
  }

  .bubble-wrap { display: flex; flex-direction: column; max-width: 68%; }
  .bubble-row.right .bubble-wrap { align-items: flex-end; }

  .bubble-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-500);
    margin-bottom: 3px;
    padding: 0 4px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--gray-900);
    border: 0.5px solid transparent;
    max-width: 100%;
    word-wrap: break-word;
  }

  .bubble.rahul {
    background: #fff;
    border-color: var(--gray-100);
    border-bottom-left-radius: 4px;
  }

  .bubble.priya {
    background: var(--blue-900);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* ── INLINE INFO CARDS inside bubbles ── */
  .info-strip {
    background: var(--blue-50);
    border: 0.5px solid var(--blue-100);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--blue-800);
    line-height: 1.5;
  }

  .info-strip.warn {
    background: var(--amber-50);
    border-color: var(--amber-100);
    color: var(--amber-800);
  }

  .info-strip.danger {
    background: var(--red-50);
    border-color: var(--red-100);
    color: var(--red-800);
  }

  .info-strip.success {
    background: var(--green-50);
    border-color: var(--green-100);
    color: var(--green-800);
  }

  .info-strip.purple {
    background: var(--purple-50);
    border-color: var(--purple-100);
    color: var(--purple-800);
  }

  .stat-cite {
    display: inline-block;
    background: var(--amber-50);
    border: 0.5px solid var(--amber-100);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--amber-800);
    margin-top: 8px;
    line-height: 1.45;
  }

  /* ── FLOW DIAGRAM ── */
  .flow-diagram {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 8px 0 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .flow-node {
    background: var(--blue-50);
    border: 0.5px solid var(--blue-200);
    color: var(--blue-800);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .flow-arrow {
    color: var(--gray-400);
    font-size: 14px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  /* ── CHECKLIST ── */
  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 0;
    font-size: 12.5px;
    color: var(--gray-800);
    border-bottom: 0.5px solid var(--gray-100);
    line-height: 1.4;
  }

  .checklist-item:last-child { border-bottom: none; }

  .check-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
  }

  /* ── CHOICES ── */
  .choices-area {
    margin: 16px 8px 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
    margin-bottom: 2px;
  }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #fff;
    border: 0.5px solid var(--gray-200);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }

  .choice-btn:hover {
    border-color: var(--blue-400);
    background: var(--blue-50);
  }

  .choice-btn:active { transform: scale(0.99); }

  .choice-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .choice-text { flex: 1; }
  .choice-title { font-size: 13px; font-weight: 600; color: var(--gray-900); }
  .choice-sub   { font-size: 11px; color: var(--gray-500); margin-top: 1px; }

  /* ── SUMMARY METRICS ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 10px 0;
  }

  .metric-card {
    background: var(--gray-50);
    border: 0.5px solid var(--gray-100);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .metric-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gray-500);
    margin-bottom: 4px;
  }

  .metric-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--blue-800);
    line-height: 1;
  }

  .metric-sub {
    font-size: 11px;
    color: var(--gray-500);
    margin-top: 3px;
  }

  /* ── TYPING INDICATOR ── */
  .typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    background: #fff;
    border: 0.5px solid var(--gray-100);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gray-300);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* ── AUTH CARD ── */
  .auth-card {
    background: var(--green-50);
    border: 0.5px solid var(--green-100);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 8px;
  }

  .auth-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .auth-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: var(--green-400);
    color: #fff;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .auth-ref {
    font-size: 11px;
    color: var(--green-600);
    font-family: monospace;
  }

  /* ── SCROLLBAR ── */
  #chatFeed::-webkit-scrollbar { width: 4px; }
  #chatFeed::-webkit-scrollbar-track { background: transparent; }
  #chatFeed::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="app-header">
  <div>
    <div class="header-title">Prior Authorization Story Simulator</div>
    <div class="header-sub">Follow Rahul's journey through the healthcare system</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="text-align:right;">
      <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:3px;" id="sceneCounter">Scene 1 of 8</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:12.5%;"></div>
      </div>
    </div>
  </div>
</header>

<!-- ── MAIN ── -->
<div style="max-width:640px;margin:0 auto;padding:20px 12px 120px;">

  <!-- Chat feed -->
  <div id="chatFeed" style="display:flex;flex-direction:column;gap:4px;"></div>

  <!-- Choices mount point -->
  <div id="choicesArea"></div>

</div>

<script>
const feed = document.getElementById('chatFeed');
const choicesEl = document.getElementById('choicesArea');

/* ── GLOBAL STATE ── */
let sceneIndex = 0;
let choiceMade = null;

/* ── HELPERS ── */
function setProgress(scene) {
  document.getElementById('progressFill').style.width = (scene / 8 * 100) + '%';
  document.getElementById('sceneCounter').textContent = 'Scene ' + scene + ' of 8';
}

function scrollDown() {
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 60);
}

/* ── APPEND HELPERS (never innerHTML on #chatFeed) ── */

function appendNarrator(text) {
  const el = document.createElement('div');
  el.className = 'narrator';
  el.textContent = text;
  el.style.animationDelay = '0s';
  feed.appendChild(el);
  void el.offsetWidth;
  el.style.animation = 'fadeUp 0.35s ease forwards';
  el.style.opacity = '0';
  scrollDown();
}

function appendSceneLabel(num, title) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin:20px 0 8px;';

  const label = document.createElement('div');
  label.className = 'scene-label';

  const dot = document.createElement('span');
  dot.textContent = '●';
  dot.style.cssText = 'font-size:7px;';

  const txt = document.createTextNode(' Scene ' + num + ' — ' + title);

  label.appendChild(dot);
  label.appendChild(txt);
  wrap.appendChild(label);
  feed.appendChild(wrap);
  scrollDown();
}

function appendBubble(side, emoji, name, contentFn, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'bubble-row ' + side;

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = emoji;

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const nameEl = document.createElement('div');
      nameEl.className = 'bubble-name';
      nameEl.textContent = name;

      const bub = document.createElement('div');
      bub.className = 'bubble ' + (side === 'left' ? 'rahul' : 'priya');

      contentFn(bub);

      wrap.appendChild(nameEl);
      wrap.appendChild(bub);
      row.appendChild(av);
      row.appendChild(wrap);
      feed.appendChild(row);
      scrollDown();
      resolve();
    }, delay || 0);
  });
}

function appendTyping(side, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'bubble-row ' + side;

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = side === 'left' ? '👦' : '👧';

      const t = document.createElement('div');
      t.className = 'typing';
      for (let i = 0; i < 3; i++) {
        const s = document.createElement('span');
        t.appendChild(s);
      }

      row.appendChild(av);
      row.appendChild(t);
      feed.appendChild(row);
      scrollDown();

      setTimeout(() => {
        feed.removeChild(row);
        resolve();
      }, 900);
    }, delay || 0);
  });
}

function appendInfoStrip(parent, text, variant, icon) {
  const strip = document.createElement('div');
  strip.className = 'info-strip ' + (variant || '');

  if (icon) {
    const iconEl = document.createElement('span');
    iconEl.textContent = icon + ' ';
    strip.appendChild(iconEl);
  }

  const t = document.createTextNode(text);
  strip.appendChild(t);
  parent.appendChild(strip);
}

function appendFlowDiagram(parent, nodes) {
  const wrap = document.createElement('div');
  wrap.className = 'flow-diagram';
  nodes.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'flow-node';
    if (n.variant === 'success') {
      node.style.background = 'var(--green-50)';
      node.style.borderColor = 'var(--green-200)';
      node.style.color = 'var(--green-800)';
    } else if (n.variant === 'warn') {
      node.style.background = 'var(--amber-50)';
      node.style.borderColor = 'var(--amber-200)';
      node.style.color = 'var(--amber-800)';
    }
    node.textContent = n.label;
    wrap.appendChild(node);
    if (i < nodes.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'flow-arrow';
      arrow.textContent = '→';
      wrap.appendChild(arrow);
    }
  });
  parent.appendChild(wrap);
}

function appendChecklist(parent, items) {
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'checklist-item';

    const dot = document.createElement('div');
    dot.className = 'check-dot';
    dot.style.background = item.color || 'var(--blue-600)';
    dot.textContent = item.icon || '✓';

    const txt = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = item.label;
    txt.appendChild(strong);
    if (item.sub) {
      txt.appendChild(document.createElement('br'));
      const sub = document.createElement('span');
      sub.style.color = 'var(--gray-500)';
      sub.style.fontSize = '11.5px';
      sub.textContent = item.sub;
      txt.appendChild(sub);
    }

    row.appendChild(dot);
    row.appendChild(txt);
    parent.appendChild(row);
  });
}

function appendCite(parent, text) {
  const el = document.createElement('div');
  el.className = 'stat-cite';
  el.textContent = '📊 ' + text;
  parent.appendChild(el);
}

function appendAuthCard(parent, refNum) {
  const card = document.createElement('div');
  card.className = 'auth-card';

  const hdr = document.createElement('div');
  hdr.className = 'auth-header';

  const badge = document.createElement('div');
  badge.className = 'auth-badge';
  badge.textContent = 'Approved';

  const ref = document.createElement('div');
  ref.className = 'auth-ref';
  ref.textContent = 'Ref: ' + refNum;

  hdr.appendChild(badge);
  hdr.appendChild(ref);

  const body = document.createElement('div');
  body.style.cssText = 'font-size:12px;color:var(--green-800);line-height:1.55;';
  body.textContent = 'Humira (adalimumab) — PA on file. No repeat authorization needed for 12 months. StarCare Health (illustrative example) case reference saved permanently.';

  card.appendChild(hdr);
  card.appendChild(body);
  parent.appendChild(card);
}

function appendMetricsGrid(parent, metrics) {
  const grid = document.createElement('div');
  grid.className = 'metrics-grid';
  metrics.forEach(m => {
    const card = document.createElement('div');
    card.className = 'metric-card';

    const lbl = document.createElement('div');
    lbl.className = 'metric-label';
    lbl.textContent = m.label;

    const val = document.createElement('div');
    val.className = 'metric-value';
    val.style.color = m.color || 'var(--blue-800)';
    val.textContent = m.value;

    const sub = document.createElement('div');
    sub.className = 'metric-sub';
    sub.textContent = m.sub;

    card.appendChild(lbl);
    card.appendChild(val);
    card.appendChild(sub);
    grid.appendChild(card);
  });
  parent.appendChild(grid);
}

/* ── CHOICES RENDERER ── */
function showChoices(choices) {
  choicesEl.innerHTML = '';

  const area = document.createElement('div');
  area.className = 'choices-area';

  const lbl = document.createElement('div');
  lbl.className = 'choice-label';
  lbl.textContent = 'What would you like to explore next?';
  area.appendChild(lbl);

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    const iconBox = document.createElement('div');
    iconBox.className = 'choice-icon';
    iconBox.style.background = c.bg || 'var(--blue-50)';
    iconBox.textContent = c.icon;

    const textWrap = document.createElement('div');
    textWrap.className = 'choice-text';

    const title = document.createElement('div');
    title.className = 'choice-title';
    title.textContent = c.title;

    const sub = document.createElement('div');
    sub.className = 'choice-sub';
    sub.textContent = c.sub;

    textWrap.appendChild(title);
    textWrap.appendChild(sub);

    const arrow = document.createElement('span');
    arrow.style.cssText = 'color:var(--gray-400);font-size:16px;';
    arrow.textContent = '→';

    btn.appendChild(iconBox);
    btn.appendChild(textWrap);
    btn.appendChild(arrow);
    area.appendChild(btn);

    btn.addEventListener('click', () => {
      choiceMade = c.id;
      choicesEl.innerHTML = '';
      c.action();
    });
  });

  choicesEl.appendChild(area);
  scrollDown();
}

/* ════════════════════════════════════════════
   SCENE DEFINITIONS
═════════════════════════════════════════════ */

/* ── SCENE 1 — DOCTOR VISIT ── */
async function scene1() {
  setProgress(1);
  appendSceneLabel(1, 'The doctor visit');
  appendNarrator('Rahul, 34, woke up with stiff, swollen joints — again. After weeks of pain, he finally made an appointment at City Medical Center.');

  await appendTyping('left', 200);
  await appendBubble('left', '👦', 'Rahul', el => {
    const t = document.createTextNode('Hi, I\'ve had joint pain and swelling for about three months. Both hands, sometimes my knees. It\'s worse in the mornings.');
    el.appendChild(t);
  }, 0);

  await appendTyping('left', 600);
  await appendBubble('left', '👦', 'Rahul', el => {
    const t = document.createTextNode('I looked it up and I\'m scared it might be arthritis...');
    el.appendChild(t);
  }, 0);

  appendNarrator('Dr. Patel examines Rahul — checking his joints, reviewing blood work, and running a rheumatoid factor test. The results come back positive.');

  await appendTyping('right', 600);
  await appendBubble('right', '🩺', 'Dr. Patel', el => {
    el.style.background = 'var(--purple-800)';
    const t = document.createTextNode('Rahul, based on your symptoms, bloodwork, and joint examination, I\'m diagnosing you with Rheumatoid Arthritis — a chronic autoimmune condition.');
    el.appendChild(t);
    appendInfoStrip(el, 'ICD-10 code: M06.9 — Rheumatoid arthritis, unspecified. This is the diagnosis code that will go on your insurance paperwork.', '', '🏷️');
  }, 0);

  await appendTyping('right', 800);
  await appendBubble('right', '🩺', 'Dr. Patel', el => {
    el.style.background = 'var(--purple-800)';
    const t = document.createTextNode('I want to prescribe Humira (adalimumab). It\'s a biologic medication that targets the part of your immune system causing the inflammation. It\'s highly effective for RA.');
    el.appendChild(t);

      { label: 'Know your timeline rights', sub: 'Urgent PA requests must be decided in 72 hours. Standard requests: 14 business days. Know these limits.', color: 'var(--blue-600)', icon: '4' },
    ]);
  }, 0);

  await appendTyping('right', 700);
  await appendBubble('right', '👧', 'Priya', el => {
    el.appendChild(document.createTextNode('And from the system perspective, here\'s how health administrators track whether PA is working — or failing — their patients:'));
    appendMetricsGrid(el, [
      { label: 'Denial rate', value: '34%', sub: 'Biologics, industry avg', color: 'var(--red-600)' },
      { label: 'Appeal overturn rate', value: '48%', sub: 'First-level appeals won', color: 'var(--green-600)' },
      { label: 'Staff hours per denial', value: '2+ hrs', sub: 'AMA 2023 data', color: 'var(--amber-600)' },
      { label: 'Avg days to resolution', value: '21 days', sub: 'Submission to approval', color: 'var(--blue-800)' },
    ]);
    appendInfoStrip(el, 'Health systems that actively track their PA denial and appeal rates can identify patterns — such as which payers deny most often, or which diagnoses are consistently mismatched — and address them proactively.', '', '📈');
  }, 0);

  await appendTyping('right', 700);
  await appendBubble('right', '👧', 'Priya', el => {
    el.appendChild(document.createTextNode('The PA system exists for a reason — to ensure treatments are appropriate and safe. But the administrative burden it places on patients and providers is a real and ongoing problem. Reform efforts are underway, but change is slow.'));
    appendCite(el, 'AMA 2023: 94% of physicians say PA has a negative impact on patient clinical outcomes. 33% of physicians report PA has led to a serious adverse event for a patient in their care.');
  }, 0);

  await appendTyping('left', 700);
  await appendBubble('left', '👦', 'Rahul', el => {
    el.appendChild(document.createTextNode('I started Humira two weeks ago. My mornings are already better. The system was frustrating — but I got there. I hope the next patient doesn\'t have to fight as hard.'));
    appendInfoStrip(el, 'Rahul\'s PA is on file with StarCare Health. Reference: SC-2024-PA-0047281. No re-authorization needed for 12 months.', 'success', '✅');
  }, 0);

  appendNarrator('End of story. Rahul\'s case illustrates a system that is improving — but still places significant burden on patients and providers. Understanding how PA works is the first step toward navigating it effectively.');

  const restartArea = document.createElement('div');
  restartArea.style.cssText = 'margin:24px 8px 8px;text-align:center;';

  const restartBtn = document.createElement('button');
  restartBtn.style.cssText = 'background:var(--blue-900);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;';
  restartBtn.textContent = 'Restart story';
  restartBtn.addEventListener('click', () => {
    feed.innerHTML = '';
    choicesEl.innerHTML = '';
    restartArea.remove();
    sceneIndex = 0;
    choiceMade = null;
    scene1();
  });

  restartArea.appendChild(restartBtn);
  choicesEl.appendChild(restartArea);
  scrollDown();
}

/* ── BOOT ── */
scene1();
</script>
