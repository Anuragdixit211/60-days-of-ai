<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass</title>
<style>
  :root{
    --bg-0:#0b0f14;
    --bg-1:#111826;
    --panel:rgba(255,255,255,0.05);
    --panel-border:rgba(255,255,255,0.09);
    --text:#e8ecf1;
    --text-dim:#8b96a8;
    --accent-a:#5eead4; /* teal - founder energy */
    --accent-b:#f0b429; /* amber - compass needle */
    --accent-c:#a78bfa; /* violet */
    --accent-d:#fb7185; /* rose */
    --eng:#5eead4;
    --design:#a78bfa;
    --product:#f0b429;
    --support:#fb7185;
    --growth:#60a5fa;
    --ops:#34d399;
    --font-display:'Compass-Display', 'Segoe UI', system-ui, sans-serif;
    --font-body:'Compass-Body', 'Segoe UI', system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 1200px 800px at 15% -10%, rgba(94,234,212,0.09), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 100% 10%, rgba(167,139,250,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding:24px 16px 60px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:980px; margin:0 auto;}

  /* ---------- Header / Compass ---------- */
  header.app-head{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  .compass-mark{
    width:56px;height:56px;margin:0 auto 14px;
    position:relative;
  }
  .compass-mark svg{width:100%;height:100%; animation:needleSettle 2.4s ease-in-out infinite;}
  @keyframes needleSettle{
    0%,100%{transform:rotate(-6deg);}
    50%{transform:rotate(6deg);}
  }
  h1.title{
    font-family:var(--font-display);
    font-size:clamp(28px,5vw,42px);
    font-weight:800;
    letter-spacing:-0.02em;
    background:linear-gradient(120deg, #fff 20%, var(--accent-a) 55%, var(--accent-b) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% 100%;
    animation:gradientDrift 8s ease infinite;
  }
  @keyframes gradientDrift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .subtitle{color:var(--text-dim); font-size:15px; margin-top:6px; letter-spacing:0.01em;}

  /* ---------- Progress ---------- */
  .progress-rail{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:26px 0 8px;
  }
  .stage-pip{
    display:flex; align-items:center; gap:8px;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    font-size:12.5px; color:var(--text-dim);
    transition:all .4s ease;
  }
  .stage-pip .num{
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.08);
    font-size:11px; font-weight:700;
  }
  .stage-pip.active{
    background:linear-gradient(135deg, rgba(94,234,212,0.15), rgba(167,139,250,0.12));
    border-color:rgba(94,234,212,0.4);
    color:var(--text);
  }
  .stage-pip.active .num{background:var(--accent-a); color:#04231f;}
  .stage-pip.done{color:var(--accent-a);}
  .stage-pip.done .num{background:var(--accent-a); color:#04231f;}
  .rail-line{width:24px; height:1px; background:var(--panel-border);}

  .q-progress{
    display:flex; justify-content:center; gap:6px; margin-bottom:30px;
  }
  .q-dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.15);
    transition:all .3s ease;
  }
  .q-dot.filled{background:var(--accent-b); box-shadow:0 0 8px rgba(240,180,41,0.6);}
  .q-dot.current{width:20px; border-radius:4px; background:var(--accent-a);}

  /* ---------- Card shell ---------- */
  .stage-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:24px;
    padding:clamp(20px,4vw,40px);
    backdrop-filter:blur(20px);
    position:relative;
    overflow:hidden;
    animation:panelIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes panelIn{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  .stage-panel::before{
    content:'';
    position:absolute; top:-40%; right:-20%;
    width:300px;height:300px;
    background:radial-gradient(circle, rgba(167,139,250,0.12), transparent 70%);
    pointer-events:none;
  }

  .stage-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--accent-b); margin-bottom:10px;
  }
  .stage-eyebrow .bar{width:18px;height:2px;background:var(--accent-b); border-radius:2px;}

  /* ---------- Ticket / Task Card ---------- */
  .ticket{
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid var(--panel-border);
    border-left:4px solid var(--accent-b);
    border-radius:14px;
    padding:20px 22px;
    margin:18px 0 26px;
    position:relative;
    animation:ticketDrop .55s cubic-bezier(.2,1,.3,1);
  }
  @keyframes ticketDrop{
    from{opacity:0; transform:translateY(-14px) rotate(-1deg);}
    to{opacity:1; transform:translateY(0) rotate(0deg);}
  }
  .ticket-tag{
    font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-dim); display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .ticket-id{color:var(--accent-b); font-family:monospace;}
  .ticket-body{font-size:17px; line-height:1.5; font-weight:500;}
  .ticket-meta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
  .meta-chip{
    font-size:11px; padding:3px 10px; border-radius:999px;
    background:rgba(255,255,255,0.06); color:var(--text-dim); border:1px solid var(--panel-border);
  }

  /* ---------- Role Cards / Drag ---------- */
  .instruction-line{font-size:13.5px; color:var(--text-dim); margin-bottom:14px;}

  .role-pool{
    display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px;
    min-height:70px;
    padding:14px;
    border-radius:16px;
    background:rgba(0,0,0,0.15);
    border:1px dashed rgba(255,255,255,0.08);
  }
  .role-card{
    padding:11px 16px;
    border-radius:12px;
    background:var(--card-color, rgba(255,255,255,0.07));
    border:1px solid rgba(255,255,255,0.14);
    font-size:14px; font-weight:600;
    cursor:grab;
    display:flex; align-items:center; gap:8px;
    user-select:none;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .role-card:hover{transform:translateY(-3px) scale(1.03); box-shadow:0 8px 18px rgba(0,0,0,0.35);}
  .role-card:active{cursor:grabbing;}
  .role-card.dragging{opacity:0.35; transform:scale(0.95);}
  .role-card.placed{opacity:0.3; cursor:default; pointer-events:none;}
  .role-card .emoji{font-size:16px;}

  .drop-zone{
    min-height:64px;
    border-radius:14px;
    border:2px dashed rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:13px;
    transition:all .25s ease;
    position:relative;
  }
  .drop-zone.dragover{
    border-color:var(--accent-a);
    background:rgba(94,234,212,0.08);
    transform:scale(1.015);
  }
  .drop-zone.filled{
    border-style:solid;
    border-color:transparent;
    padding:4px;
  }
  .drop-zone .placed-card{width:100%;}

  /* Stage 1 single slot */
  .single-slot-label{
    font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--accent-a); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }

  /* Stage 2 sequence */
  .sequence-track{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:18px 0 24px;
  }
  .seq-slot{
    width:150px; min-height:56px;
  }
  .seq-arrow{color:var(--text-dim); font-size:18px; flex-shrink:0;}

  /* Stage 3 multi-select */
  .role-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;
    margin-bottom:22px;
  }
  .role-select-card{
    padding:14px; border-radius:14px;
    background:var(--card-color, rgba(255,255,255,0.06));
    border:2px solid rgba(255,255,255,0.1);
    cursor:pointer; text-align:center; font-weight:600; font-size:13.5px;
    transition:all .2s ease;
    position:relative;
  }
  .role-select-card:hover{transform:translateY(-2px);}
  .role-select-card.selected{
    border-color:var(--accent-a);
    box-shadow:0 0 0 3px rgba(94,234,212,0.18), 0 8px 20px rgba(0,0,0,0.3);
  }
  .role-select-card .rank{
    position:absolute; top:-8px; right:-8px;
    width:22px;height:22px;border-radius:50%;
    background:var(--accent-a); color:#04231f; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    animation:popIn .25s ease;
  }
  @keyframes popIn{from{transform:scale(0);} to{transform:scale(1);}}

  /* ---------- Buttons ---------- */
  .btn-row{display:flex; gap:12px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
  .btn{
    padding:12px 26px; border-radius:12px; border:none; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:14px;
    transition:all .2s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent-a), #34c9b0);
    color:#04231f;
    box-shadow:0 4px 16px rgba(94,234,212,0.25);
  }
  .btn-primary:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 8px 22px rgba(94,234,212,0.35);}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{
    background:transparent; border:1px solid var(--panel-border); color:var(--text-dim);
  }
  .btn-ghost:hover{color:var(--text); border-color:rgba(255,255,255,0.3);}

  /* ---------- Reveal panel ---------- */
  .reveal{
    margin-top:22px;
    padding:20px;
    border-radius:16px;
    background:linear-gradient(160deg, rgba(94,234,212,0.07), rgba(167,139,250,0.05));
    border:1px solid rgba(94,234,212,0.25);
    animation:revealIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes revealIn{
    from{opacity:0; transform:translateY(10px); max-height:0;}
    to{opacity:1; transform:translateY(0);}
  }
  .reveal-row{margin-bottom:12px;}
  .reveal-row:last-child{margin-bottom:0;}
  .reveal-label{
    font-size:11.5px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase;
    display:flex; align-items:center; gap:6px; margin-bottom:5px;
  }
  .reveal-label.owner{color:var(--accent-a);}
  .reveal-label.why{color:var(--accent-b);}
  .reveal-label.assist{color:var(--accent-c);}
  .reveal-text{font-size:14.5px; line-height:1.55; color:#dfe4ea;}
  .assist-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .assist-chip{
    font-size:12.5px; padding:5px 12px; border-radius:999px;
    background:rgba(167,139,250,0.14); border:1px solid rgba(167,139,250,0.3); color:#dcd3fb;
  }

  /* Stage 2 flow animation strip */
  .flow-strip{
    display:flex; align-items:center; gap:6px; margin:16px 0; flex-wrap:wrap;
    min-height:50px;
  }
  .flow-node{
    padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600;
    background:var(--card-color, rgba(255,255,255,0.08));
    border:1px solid rgba(255,255,255,0.15);
    opacity:0; transform:translateX(-14px);
    animation:flowIn .5s ease forwards;
  }
  @keyframes flowIn{to{opacity:1; transform:translateX(0);}}
  .flow-arrow{color:var(--text-dim); opacity:0; animation:flowIn .5s ease forwards;}

  /* ---------- Chart / final ---------- */
  .chart-wrap{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:20px;
    margin:26px 0;
  }
  .bar-card{text-align:center;}
  .bar-track{
    height:160px; width:100%; max-width:64px; margin:0 auto;
    background:rgba(255,255,255,0.05); border-radius:10px;
    display:flex; align-items:flex-end; overflow:hidden;
    border:1px solid var(--panel-border);
  }
  .bar-fill{
    width:100%; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, var(--bar-color,#5eead4), color-mix(in srgb, var(--bar-color,#5eead4) 60%, black));
    height:0%;
    transition:height 1.1s cubic-bezier(.16,1,.3,1);
  }
  .bar-label{margin-top:10px; font-size:13px; font-weight:700; color:var(--text-dim);}
  .bar-pct{font-size:20px; font-weight:800; margin-top:2px;}

  .reflection-grid{display:grid; gap:16px; margin-top:22px;}
  .reflect-card{
    padding:18px 20px; border-radius:14px;
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border);
    border-left:3px solid var(--reflect-color, var(--accent-a));
  }
  .reflect-title{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--reflect-color, var(--accent-a)); margin-bottom:6px;}
  .reflect-body{font-size:14.5px; line-height:1.6; color:#dfe4ea;}

  .insight-banner{
    margin-top:24px; padding:22px 24px; border-radius:16px;
    background:linear-gradient(135deg, rgba(240,180,41,0.14), rgba(94,234,212,0.1));
    border:1px solid rgba(240,180,41,0.3);
    text-align:center; font-size:16px; font-weight:600; line-height:1.6;
    font-style:italic;
  }

  .celebrate-wrap{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;}
  .confetti{
    position:absolute; top:-20px; width:8px; height:14px; opacity:0.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:0.2;}
  }

  .replay-row{display:flex; justify-content:center; margin-top:26px;}

  footer.credit{
    text-align:center; margin-top:30px; font-size:12px; color:var(--text-dim); opacity:0.6;
  }

  @media (max-width: 560px){
    .stage-pip span.label{display:none;}
    .rail-line{width:12px;}
    .seq-slot{width:120px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  /* ============================ DATA ============================ */

  const ROLES = {
    fe:  {name:"Frontend Dev",     emoji:"🖥️", color:"#5eead4"},
    be:  {name:"Backend Dev",      emoji:"🗄️", color:"#34d399"},
    qa:  {name:"QA Engineer",      emoji:"🔍", color:"#60a5fa"},
    pm:  {name:"Product Manager",  emoji:"🧭", color:"#f0b429"},
    ux:  {name:"UX Designer",      emoji:"🎨", color:"#a78bfa"},
    cs:  {name:"Customer Support", emoji:"💬", color:"#fb7185"},
    em:  {name:"Eng Lead",         emoji:"🛠️", color:"#22d3ee"},
    growth:{name:"Growth/Marketing",emoji:"📈", color:"#60a5fa"},
    founder:{name:"Founder/CEO",   emoji:"🚀", color:"#f472b6"},
    ops: {name:"Ops/Finance",      emoji:"📊", color:"#34d399"},
    sales:{name:"Sales",           emoji:"🤝", color:"#fbbf24"},
    data:{name:"Data Analyst",     emoji:"📉", color:"#818cf8"}
  };

  // STAGE 1: Who Owns This — 9 cards authored, we use 3 at random-ish fixed order (first 3 shown, rest available for variety later)
  const STAGE1 = [
    {
      id:"pay-ios",
      tag:"BUG-1042", meta:["Production","Reported by 3 users"],
      task:"A customer reports that checkout fails only on iPhones, right after your last release.",
      pool:["fe","be","qa","pm","ux","cs","em","growth"],
      owner:"fe",
      why:"The failure is isolated to one platform right after a release, which almost always points to a client-side rendering or Apple-specific payment SDK issue — squarely in the frontend's code path. They shipped the change and can trace it fastest.",
      assist:["qa","be"],
      assistWhy:"QA reproduces the bug reliably across devices before a fix ships, and Backend confirms the payment API itself is healthy so the frontend isn't chasing a phantom."
    },
    {
      id:"onboarding-drop",
      tag:"METRIC-88", meta:["Analytics alert","Week-over-week dip"],
      task:"New user signups are completing, but 40% abandon during onboarding on day one.",
      pool:["ux","pm","fe","cs","data","growth"],
      owner:"pm",
      why:"A funnel drop-off is a product decision problem first — is the flow asking for too much, too early? The PM owns the funnel's shape and prioritizes what gets fixed, even though the fix itself may be visual or technical.",
      assist:["ux","data"],
      assistWhy:"UX identifies exactly where users hesitate or bounce, and the Data Analyst quantifies which step is losing the most people so effort isn't spent guessing."
    },
    {
      id:"press-mention",
      tag:"OPP-19", meta:["Inbound","Time-sensitive"],
      task:"A well-known tech blog wants a quote from your company about a trend in your industry, by tomorrow.",
      pool:["founder","growth","pm","cs","sales","ux"],
      owner:"founder",
      why:"Press quotes represent the company's voice and strategic positioning in public. At a startup's size, that's the founder's call — it shapes external perception in a way no other role is mandated to own.",
      assist:["growth"],
      assistWhy:"Growth/Marketing drafts the quote and coordinates timing with the journalist, so the founder can focus on the message rather than the logistics."
    },
    {
      id:"slow-api",
      tag:"PERF-204", meta:["Internal report","Getting worse"],
      task:"The dashboard is taking 8+ seconds to load for customers with large datasets.",
      pool:["be","fe","qa","em","data","ops"],
      owner:"be",
      why:"Load time tied to dataset size points to a query or data-processing bottleneck, which lives in backend logic and database design — not in how the page is rendered.",
      assist:["em","fe"],
      assistWhy:"The Eng Lead helps weigh whether this needs a quick patch or a deeper rearchitecture, and Frontend can add loading states so the wait feels less broken in the meantime."
    },
    {
      id:"contract-terms",
      tag:"DEAL-56", meta:["Enterprise client","Legal ambiguity"],
      task:"A potential enterprise client's legal team wants custom data-retention terms not in your standard contract.",
      pool:["founder","sales","ops","pm"],
      owner:"ops",
      why:"Contract terms and data-retention commitments carry legal and financial exposure — that sits with whoever owns operations and compliance, not with whoever closed the lead.",
      assist:["sales","founder"],
      assistWhy:"Sales keeps the relationship warm and relays what the client actually needs, while the founder weighs in on any exception that affects overall company risk."
    },
    {
      id:"design-inconsistent",
      tag:"UI-77", meta:["Internal feedback","Low urgency"],
      task:"Team members notice three different button styles across the product after several fast feature launches.",
      pool:["ux","fe","pm","em"],
      owner:"ux",
      why:"Visual inconsistency is a design-system problem — UX owns defining and maintaining the shared components that keep the product coherent as it grows quickly.",
      assist:["fe"],
      assistWhy:"Frontend implements the consolidated design system in code once UX defines the standard, and flags where existing code makes unification harder."
    },
    {
      id:"server-down",
      tag:"INC-311", meta:["Live incident","All customers affected"],
      task:"The production server just went down and customers can't log in at all, right now.",
      pool:["be","em","cs","fe","founder"],
      owner:"em",
      why:"A full outage needs someone coordinating the response in real time, making calls under pressure, and keeping the team focused — that's the incident-commander role the Engineering Lead typically holds.",
      assist:["be","cs"],
      assistWhy:"Backend engineers dig into logs to find and fix the root cause, while Customer Support keeps users informed so confusion doesn't compound the damage."
    },
    {
      id:"competitor-feature",
      tag:"STRAT-12", meta:["Market signal","No urgency"],
      task:"A competitor just launched a feature your users have been requesting for months.",
      pool:["pm","founder","growth","ux","sales"],
      owner:"pm",
      why:"Deciding whether, how, and when to respond to a competitive move is a prioritization and roadmap decision — the PM weighs it against everything else already planned.",
      assist:["founder","sales"],
      assistWhy:"The founder gives a view on strategic positioning, and Sales reports how much this is actually costing deals versus how loud it sounds internally."
    },
    {
      id:"burnout-signal",
      tag:"TEAM-05", meta:["People concern","Sensitive"],
      task:"Two engineers on the same team have missed deadlines and seem exhausted after a hard sprint.",
      pool:["em","founder","pm","ops"],
      owner:"em",
      why:"Team health, workload, and pacing are direct management responsibilities. The Engineering Lead is closest to the day-to-day and best positioned to have that conversation and adjust the plan.",
      assist:["pm","founder"],
      assistWhy:"The PM can flex the roadmap to reduce near-term pressure, and the founder ensures this doesn't get treated as a purely individual problem."
    }
  ];

  // STAGE 2: Task Routing
  const STAGE2 = [
    {
      id:"route-bug",
      tag:"FLOW-1", meta:["Standard bug report"],
      task:"A user reports a broken feature through the help widget. Build the path this ticket should travel.",
      pool:["cs","qa","be","pm","fe"],
      correctOrder:["cs","qa","be","fe"],
      why:"Support captures and triages what the user actually experienced. QA reproduces it reliably so engineering isn't debugging a vague report. Backend or Frontend fixes the root cause depending on where it lives — here, tracing it lands in Backend, then Frontend verifies the visible fix. Skipping QA is the most common shortcut that wastes an engineer's day chasing a bug that isn't reproducible."
    },
    {
      id:"route-feature",
      tag:"FLOW-2", meta:["New feature request"],
      task:"Several customers separately ask for the same missing feature. Build the path this request should travel.",
      pool:["cs","pm","ux","em","fe"],
      correctOrder:["cs","pm","ux","fe"],
      why:"Support aggregates the pattern across customers so it isn't dismissed as a one-off. Product decides if and how it fits the roadmap. UX shapes how it should work before anyone writes code. Frontend (with backend as needed) builds it. Going straight to engineering without a PM decision often means building the wrong version of the right idea."
    },
    {
      id:"route-outage",
      tag:"FLOW-3", meta:["Live incident"],
      task:"Monitoring alerts fire for a spike in failed API requests. Build the path this incident should travel.",
      pool:["em","be","cs","pm"],
      correctOrder:["em","be","cs"],
      why:"The Engineering Lead takes command first to coordinate response before anyone starts guessing independently. Backend investigates and resolves the technical root cause. Support communicates status to affected customers in parallel. Notice this only needs three steps — incidents move fast, and adding a Product Manager into the live loop would slow the fix without adding value in the moment."
    }

  // STAGE 3: Collaboration Challenge
  const STAGE3 = [
    {
      id:"satisfaction-drop",
      tag:"SIGNAL-1", meta:["Trend over 2 weeks","Multiple channels"],

    {

      tag:"SIGNAL-2", meta:["Sudden growth","Good problem to have"],

    },
    {

      primary:"cs",
      supporting:["pm","growth","qa"],

    },
    {
      id:"feature-delay",
      tag:"SIGNAL-4", meta:["Roadmap risk","External commitment made"],
      task:"A major feature promised to customers for this quarter is now going to be late, and a few clients were told a date.",
      pool:["pm","em","sales","founder","cs","ux"],
      primary:"pm",
      supporting:["em","sales","founder"],
      why:"The PM owns the roadmap and is best placed to decide what changes — cut scope, extend the date, or reprioritize — since they see the full tradeoff, not just one slice of it.",
      flow:"Eng Lead gives an honest updated estimate → PM decides the realistic path forward → Sales manages expectations with the specific clients who were told a date → Founder weighs in if the delay affects a strategic commitment."
    }
  ];

  const TOTAL_Q = 9; // 3 per stage

  /* ============================ STATE ============================ */

  let state = {
    stage: 1,
    stage1Idx: 0,
    stage2Idx: 0,
    stage3Idx: 0,
    stage1Answers: [], // {correct:bool}
    stage2Answers: [], // {correct:bool, order:[]}
    stage3Answers: [], // {primaryCorrect, supportOverlap, count}
    scores: {ownership:0, delegation:0, collaboration:0, workflow:0}
  };

  let dragPayload = null; // currently dragged role key

  const app = document.getElementById('app');

  /* ============================ UTIL ============================ */

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function roleColorVar(key){
    return ROLES[key] ? ROLES[key].color : '#888';
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  /* ============================ HEADER / PROGRESS ============================ */

  function renderHeader(){
    const head = el('header','app-head');
    head.innerHTML = `
      <div class="compass-mark">
        <svg viewBox="0 0 56 56" fill="none">
          <circle cx="28" cy="28" r="26" stroke="url(#g1)" stroke-width="2"/>

  function renderProgress(){
    const wrap = el('div');
    const rail = el('div','progress-rail');
    const stages = [
      {n:1, label:"Who Owns This?"},
      {n:2, label:"Task Routing"},
      {n:3, label:"Collaboration"}
    ];
    stages.forEach((s, i)=>{
      const pip = el('div','stage-pip' + (state.stage===s.n ? ' active' : state.stage>s.n ? ' done':''));
      pip.innerHTML = `<span class="num">${state.stage>s.n?'✓':s.n}</span><span class="label">${s.label}</span>`;
      rail.appendChild(pip);
      if(i<stages.length-1) rail.appendChild(el('div','rail-line'));
    });
    wrap.appendChild(rail);

    // question dots for current stage
    const qrow = el('div','q-progress');
    const idxMap = {1:state.stage1Idx, 2:state.stage2Idx, 3:state.stage3Idx};
    const curIdx = idxMap[state.stage];
    for(let i=0;i<3;i++){
      const d = el('div','q-dot' + (i<curIdx?' filled':'') + (i===curIdx?' current':''));
      qrow.appendChild(d);
    }
    wrap.appendChild(qrow);
    return wrap;
  }

  function fullRerender(){
    app.innerHTML = '';
    app.appendChild(renderHeader());
    app.appendChild(renderProgress());
    if(state.stage===1) app.appendChild(renderStage1());
    else if(state.stage===2) app.appendChild(renderStage2());
    else if(state.stage===3) app.appendChild(renderStage3());
    else app.appendChild(renderFinal());
    const foot = el('footer','credit','Task Compass · a management simulation, not a quiz');
    app.appendChild(foot);

  /* ============================ ROLE CARD FACTORY ============================ */

  function makeRoleCard(key, draggable){
    const r = ROLES[key];
    const card = el('div','role-card');
    card.style.setProperty('--card-color', hexA(r.color, 0.16));
    card.style.borderColor = hexA(r.color, 0.4);
    card.dataset.role = key;
    card.innerHTML = `<span class="emoji">${r.emoji}</span><span>${r.name}</span>`;
    if(draggable){
      card.draggable = true;
      card.addEventListener('dragstart', (e)=>{
        dragPayload = key;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
    }
    return card;
  }

  function hexA(hex, alpha){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function attachDropZone(zone, onDrop){
    zone.addEventListener('dragover', (e)=>{
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('dragover'); });
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      if(dragPayload){ onDrop(dragPayload); dragPayload = null; }
    });
  }

  /* ============================ STAGE 1 ============================ */

  function renderStage1(){
    const q = STAGE1[state.stage1Idx];
    const panel = el('div','stage-panel');
    panel.innerHTML = `<div class="stage-eyebrow"><span class="bar"></span>Stage 1 · Who Owns This?</div>`;

    const ticket = el('div','ticket');
    ticket.innerHTML = `
      <div class="ticket-tag">🎫 <span class="ticket-id">${q.tag}</span></div>
      <div class="ticket-body">${q.task}</div>
      <div class="ticket-meta">${q.meta.map(m=>`<span class="meta-chip">${m}</span>`).join('')}</div>
    `;
    panel.appendChild(ticket);

    panel.appendChild(el('div','instruction-line','Drag the role that should <strong>primarily own</strong> this into the slot below.'));

    const slotLabel = el('div','single-slot-label','🎯 Primary Owner Slot');
    panel.appendChild(slotLabel);

    const dropZone = el('div','drop-zone');
    dropZone.dataset.filled = "false";
    panel.appendChild(dropZone);

    const pool = el('div','role-pool');
    q.pool.forEach(key=>{
      const c = makeRoleCard(key, true);
      pool.appendChild(c);
    });
    panel.appendChild(pool);

    let placedKey = null;

    attachDropZone(dropZone, (key)=>{
      placedKey = key;
      dropZone.classList.add('filled');
      dropZone.innerHTML = '';
      const placedWrap = el('div','placed-card');
      placedWrap.appendChild(makeRoleCard(key, false));
      dropZone.appendChild(placedWrap);
      // mark that card's twin in pool as placed
      pool.querySelectorAll('.role-card').forEach(c=>{
        if(c.dataset.role===key) c.classList.add('placed');
      });
      submitBtn.disabled = false;
    });

    const btnRow = el('div','btn-row');
    const submitBtn = el('button','btn btn-primary','Confirm Ownership');
    submitBtn.disabled = true;
    btnRow.appendChild(submitBtn);
    panel.appendChild(btnRow);

    submitBtn.addEventListener('click', ()=>{
      if(!placedKey) return;
      submitBtn.disabled = true;
      submitBtn.style.display = 'none';

      const correct = placedKey === q.owner;
      state.stage1Answers.push({correct});
      state.scores.ownership += correct ? 1 : 0.4;
      state.scores.workflow += correct ? 0.4 : 0.15;

      const reveal = el('div','reveal');
      reveal.innerHTML = `
        <div class="reveal-row">
          <div class="reveal-label owner">✓ Primary Owner: ${ROLES[q.owner].emoji} ${ROLES[q.owner].name}</div>
        </div>
        <div class="reveal-row">
          <div class="reveal-label why">Why they own it</div>
          <div class="reveal-text">${q.why}</div>
        </div>
        <div class="reveal-row">
          <div class="reveal-label assist">Roles that may assist</div>
          <div class="assist-chips">${q.assist.map(a=>`<span class="assist-chip">${ROLES[a].emoji} ${ROLES[a].name}</span>`).join('')}</div>
          <div class="reveal-text" style="margin-top:8px;">${q.assistWhy}</div>
        </div>
      `;
      panel.appendChild(reveal);

      const nextRow = el('div','btn-row');
      const nextBtn = el('button','btn btn-primary', state.stage1Idx < 2 ? 'Next Task →' : 'Continue to Stage 2 →');
      nextRow.appendChild(nextBtn);
      panel.appendChild(nextRow);

      nextBtn.addEventListener('click', ()=>{
        if(state.stage1Idx < 2){
          state.stage1Idx++;
        } else {
          state.stage = 2;
        }
        fullRerender();
      });
    });

    return panel;
  }

  /* ============================ STAGE 2 ============================ */

  function renderStage2(){
    const q = STAGE2[state.stage2Idx];
    const panel = el('div','stage-panel');
    panel.innerHTML = `<div class="stage-eyebrow"><span class="bar"></span>Stage 2 · Task Routing</div>`;

    const ticket = el('div','ticket');
    ticket.innerHTML = `
      <div class="ticket-tag">🎫 <span class="ticket-id">${q.tag}</span></div>
      <div class="ticket-body">${q.task}</div>
      <div class="ticket-meta">${q.meta.map(m=>`<span class="meta-chip">${m}</span>`).join('')}</div>
    `;
    panel.appendChild(ticket);

    const stepCount = q.correctOrder.length;
    panel.appendChild(el('div','instruction-line',
      `Drag roles into order to build the workflow. This one needs <strong>${stepCount} steps</strong> — leave any extra roles unused if they don't belong in the chain.`));

    const track = el('div','sequence-track');
    const slots = [];
    for(let i=0;i<stepCount;i++){
      const slot = el('div','drop-zone seq-slot', (i+1)+'');
      slots.push(slot);
      track.appendChild(slot);
      if(i<stepCount-1) track.appendChild(el('div','seq-arrow','→'));
    }
    panel.appendChild(track);

    const pool = el('div','role-pool');
    q.pool.forEach(key=>{
      pool.appendChild(makeRoleCard(key, true));
    });
    panel.appendChild(pool);

    const placedOrder = new Array(stepCount).fill(null);

    slots.forEach((slot, i)=>{
      attachDropZone(slot, (key)=>{
        // if this key already placed elsewhere, remove it there
        placedOrder.forEach((v,idx)=>{
          if(v===key){ placedOrder[idx]=null; slots[idx].classList.remove('filled'); slots[idx].innerHTML=(idx+1)+''; }
        });
        placedOrder[i] = key;
        slot.classList.add('filled');
        slot.innerHTML = '';
        slot.appendChild(makeRoleCard(key, false));

        pool.querySelectorAll('.role-card').forEach(c=>{
          c.classList.remove('placed');
        });
        placedOrder.forEach(k=>{
          if(k) pool.querySelectorAll('.role-card').forEach(c=>{
            if(c.dataset.role===k) c.classList.add('placed');
          });
        });

        submitBtn.disabled = placedOrder.some(v=>v===null);
      });
    });

    const btnRow = el('div','btn-row');
    const submitBtn = el('button','btn btn-primary','Confirm Workflow');
    submitBtn.disabled = true;
    btnRow.appendChild(submitBtn);
    panel.appendChild(btnRow);

    submitBtn.addEventListener('click', ()=>{
      submitBtn.disabled = true;
      submitBtn.style.display = 'none';

      const correct = placedOrder.every((v,i)=>v===q.correctOrder[i]);
      const partialMatches = placedOrder.filter((v,i)=>v===q.correctOrder[i]).length;
      state.stage2Answers.push({correct, order:placedOrder});
      state.scores.workflow += correct ? 1 : (partialMatches/stepCount)*0.6;
      state.scores.delegation += correct ? 0.6 : 0.3;

      // animate flow strip using the correct order
      const flowWrap = el('div','reveal');
      const stripLabel = el('div','reveal-label owner','✓ How this task actually flows');
      flowWrap.appendChild(stripLabel);
      const strip = el('div','flow-strip');
      flowWrap.appendChild(strip);

      const whyRow = el('div','reveal-row');
      whyRow.style.marginTop = '14px';
      whyRow.innerHTML = `
        <div class="reveal-label why">Why this order works</div>
        <div class="reveal-text">${q.why}</div>
      `;
      flowWrap.appendChild(whyRow);

      if(!correct){
        const noteRow = el('div','reveal-row');
        noteRow.innerHTML = `<div class="reveal-text" style="opacity:0.85;">Your version matched ${partialMatches} of ${stepCount} steps in the right position — close counts here, since real teams iterate on process too.</div>`;
        flowWrap.appendChild(noteRow);
      }

      panel.appendChild(flowWrap);

      q.correctOrder.forEach((key, i)=>{
        setTimeout(()=>{
          if(i>0){
            const arrow = el('span','flow-arrow','→');
            arrow.style.animationDelay = '0s';
            strip.appendChild(arrow);
          }
          const node = makeRoleCard(key, false);
          node.classList.add('flow-node');
          node.style.setProperty('--card-color', hexA(ROLES[key].color,0.18));
          strip.appendChild(node);
        }, i*260);
      });

      const nextRow = el('div','btn-row');
      const nextBtn = el('button','btn btn-primary', state.stage2Idx < 2 ? 'Next Task →' : 'Continue to Stage 3 →');
      nextRow.appendChild(nextBtn);
      panel.appendChild(nextRow);

      nextBtn.addEventListener('click', ()=>{
        if(state.stage2Idx < 2){
          state.stage2Idx++;
        } else {
          state.stage = 3;
        }
        fullRerender();
      });
    });

    return panel;
  }

  /* ============================ STAGE 3 ============================ */

  function renderStage3(){
    const q = STAGE3[state.stage3Idx];
    const panel = el('div','stage-panel');
    panel.innerHTML = `<div class="stage-eyebrow"><span class="bar"></span>Stage 3 · Collaboration Challenge</div>`;

    const ticket = el('div','ticket');
    ticket.innerHTML = `
      <div class="ticket-tag">📡 <span class="ticket-id">${q.tag}</span></div>
      <div class="ticket-body">${q.task}</div>
      <div class="ticket-meta">${q.meta.map(m=>`<span class="meta-chip">${m}</span>`).join('')}</div>
    `;
    panel.appendChild(ticket);

    panel.appendChild(el('div','instruction-line','Select up to <strong>4 roles</strong> you\'d bring in to handle this — the first one you pick is treated as the lead.'));

    const grid = el('div','role-grid');
    const selected = [];

    q.pool.forEach(key=>{
      const r = ROLES[key];
      const card = el('div','role-select-card');
      card.style.setProperty('--card-color', hexA(r.color,0.12));
      card.style.borderColor = hexA(r.color, 0.3);
      card.innerHTML = `<div>${r.emoji}</div><div style="margin-top:6px;">${r.name}</div>`;
      card.addEventListener('click', ()=>{
        const idx = selected.indexOf(key);
        if(idx>-1){
          selected.splice(idx,1);
          card.classList.remove('selected');
          const rankEl = card.querySelector('.rank');
          if(rankEl) rankEl.remove();
        } else {
          if(selected.length>=4) return;
          selected.push(key);
          card.classList.add('selected');
          const rank = el('div','rank', selected.length+'');
          card.appendChild(rank);
        }
        // renumber all ranks
        grid.querySelectorAll('.role-select-card').forEach(c=>{
          const k = q.pool[Array.from(grid.children).indexOf(c)];
        });
        selected.forEach((k,i)=>{
          const idx2 = q.pool.indexOf(k);
          const c2 = grid.children[idx2];
          const r2 = c2.querySelector('.rank');
          if(r2) r2.textContent = i+1;
        });
        submitBtn.disabled = selected.length===0;
      });
      grid.appendChild(card);
    });
    panel.appendChild(grid);

    const btnRow = el('div','btn-row');
    const submitBtn = el('button','btn btn-primary','Deploy Team');
    submitBtn.disabled = true;
    btnRow.appendChild(submitBtn);
    panel.appendChild(btnRow);

    submitBtn.addEventListener('click', ()=>{
      submitBtn.disabled = true;
      submitBtn.style.display = 'none';
      grid.querySelectorAll('.role-select-card').forEach(c=> c.style.pointerEvents='none');

      const chosenPrimary = selected[0];
      const primaryCorrect = chosenPrimary === q.primary;
      const supportSelected = selected.slice(1);
      const overlap = supportSelected.filter(k=>q.supporting.includes(k)).length;

      state.stage3Answers.push({primaryCorrect, overlap, count:selected.length});
      state.scores.collaboration += Math.min(selected.length,4)/4 * 0.8 + (overlap>0?0.2:0);
      state.scores.ownership += primaryCorrect ? 0.6 : 0.2;
      state.scores.delegation += (overlap/Math.max(q.supporting.length,1)) * 0.8;

      const reveal = el('div','reveal');
      reveal.innerHTML = `
        <div class="reveal-row">
          <div class="reveal-label owner">✓ Primary Owner: ${ROLES[q.primary].emoji} ${ROLES[q.primary].name}</div>
        </div>
        <div class="reveal-row">
          <div class="reveal-label assist">Supporting Teams</div>
          <div class="assist-chips">${q.supporting.map(a=>`<span class="assist-chip">${ROLES[a].emoji} ${ROLES[a].name}</span>`).join('')}</div>
        </div>
        <div class="reveal-row">
          <div class="reveal-label why">Reasoning</div>
          <div class="reveal-text">${q.why}</div>
        </div>
        <div class="reveal-row">
          <div class="reveal-label" style="color:var(--accent-d);">Possible Communication Flow</div>
          <div class="reveal-text">${q.flow}</div>
        </div>
      `;
      panel.appendChild(reveal);

      const nextRow = el('div','btn-row');
      const nextBtn = el('button','btn btn-primary', state.stage3Idx < 2 ? 'Next Situation →' : 'See Your Results →');
      nextRow.appendChild(nextBtn);
      panel.appendChild(nextRow);

      nextBtn.addEventListener('click', ()=>{
        if(state.stage3Idx < 2){
          state.stage3Idx++;
        } else {
          state.stage = 4; // final
        }
        fullRerender();
      });
    });

    return panel;
  }

  /* ============================ FINAL ============================ */

  function renderFinal(){
    const panel = el('div','stage-panel');
    panel.innerHTML = `<div class="stage-eyebrow"><span class="bar"></span>Your Understanding</div>`;

    const heading = el('div', null, `<div style="font-size:20px;font-weight:800;margin-bottom:4px;">Simulation complete 🧭</div><div style="color:var(--text-dim);font-size:14px;margin-bottom:10px;">Here's what your decisions revealed — not a score, a shape.</div>`);
    panel.appendChild(heading);

    // normalize scores to 0-100, max possible per category roughly:
    // ownership max ~ (1*3 stage1) + (0.6*3 stage3) = 4.8
    // delegation max ~ (0.6*3 stage2) + (0.8*3 stage3) = 4.2
    // collaboration max ~ (1.0*3 stage3) = 3.0 approx (0.8+0.2 per q)
    // workflow max ~ (0.4*3 s1) + (1*3 s2) = 4.2
    const maxes = {ownership:4.8, delegation:4.2, collaboration:3.0, workflow:4.2};
    const pct = {};
    Object.keys(state.scores).forEach(k=>{
      pct[k] = Math.max(6, Math.min(100, Math.round((state.scores[k]/maxes[k])*100)));
    });

    const chartWrap = el('div','chart-wrap');
    const labels = {ownership:['Ownership','var(--accent-a)'], delegation:['Delegation','var(--accent-b)'], collaboration:['Collaboration','var(--accent-c)'], workflow:['Workflow Thinking','var(--accent-d)']};
    Object.keys(labels).forEach(key=>{
      const [label,color] = labels[key];
      const card = el('div','bar-card');
      card.innerHTML = `
        <div class="bar-track"><div class="bar-fill" style="--bar-color:${color.replace('var(','').replace(')','')};"></div></div>
        <div class="bar-label">${label}</div>
        <div class="bar-pct" style="color:${color}">${pct[key]}%</div>
      `;
      chartWrap.appendChild(card);
    });
    panel.appendChild(chartWrap);

    // trigger bar animation after mount
    setTimeout(()=>{
      const fills = chartWrap.querySelectorAll('.bar-fill');
      const keys = Object.keys(labels);
      fills.forEach((f,i)=>{ f.style.height = pct[keys[i]] + '%'; });
    }, 80);

    // Reflection generation
    const s1Correct = state.stage1Answers.filter(a=>a.correct).length;
    const s2Correct = state.stage2Answers.filter(a=>a.correct).length;
    const avgSelect = state.stage3Answers.reduce((s,a)=>s+a.count,0) / Math.max(state.stage3Answers.length,1);
    const overAssignTendency = avgSelect >= 3.3;
    const underAssignTendency = avgSelect <= 1.7;
    const primaryHits = state.stage3Answers.filter(a=>a.primaryCorrect).length;

    const reflectGrid = el('div','reflection-grid');

    const wellCard = el('div','reflect-card');
    wellCard.style.setProperty('--reflect-color','var(--accent-a)');
    wellCard.innerHTML = `
      <div class="reflect-title">✓ What you understood well</div>
      <div class="reflect-body">${
        s1Correct >= 2
        ? `You correctly identified the primary owner in ${s1Correct} of 3 ownership scenarios — you're reading tasks by where the root cause actually lives, not just by job title.`
        : `You engaged with some genuinely ambiguous ownership calls — several of these have real debate even among experienced managers, and getting some "wrong" is part of learning where the lines actually sit.`
      } ${primaryHits >= 2 ? `You also picked the right lead role in ${primaryHits} of 3 collaboration scenarios, showing a good instinct for who should be in the driver's seat during a messy situation.` : ''}</div>
    `;
    reflectGrid.appendChild(wellCard);

    const overCard = el('div','reflect-card');
    overCard.style.setProperty('--reflect-color','var(--accent-d)');
    overCard.innerHTML = `
      <div class="reflect-title">⚠ Where you tended to over-assign responsibility</div>
      <div class="reflect-body">${
        overAssignTendency
        ? `You often brought in 3-4 roles for situations that may have needed a tighter team. Pulling in more people can feel thorough, but it can also slow decisions down and blur who's actually accountable. Worth asking: would this specific person's input change the outcome, or just add a voice?`
        : `You generally kept your teams focused rather than defaulting to "everyone should weigh in." That's a healthy instinct — though it's worth double-checking on the highest-stakes calls that a smaller team hasn't missed someone who'd catch a blind spot.`
      }</div>
    `;
    reflectGrid.appendChild(overCard);

    const underCard = el('div','reflect-card');
    underCard.style.setProperty('--reflect-color','var(--accent-c)');
    underCard.innerHTML = `
      <div class="reflect-title">⚠ Where you may have underestimated collaboration</div>
      <div class="reflect-body">${
        underAssignTendency
        ? `You tended to select just one or two roles for situations that were often described as ambiguous or cross-functional. Some of these scenarios were designed to resist a single clean answer — the "right" response usually widens rather than narrows the circle.`
        : `You were generally willing to widen the circle when a situation called for it, rather than assuming one department could fully own something messy on their own.`
      }</div>
    `;
    reflectGrid.appendChild(underCard);

    panel.appendChild(reflectGrid);

    const insights = [
      "Many real workplace problems are solved by teams rather than individuals, even when one person is ultimately accountable for the outcome.",
      "Ownership and doing-the-work aren't always the same role — the person who owns a problem often coordinates rather than personally executes every step.",
      "The best-run teams tend to route work through the fewest steps that still catch real mistakes, not the most steps that feel thorough.",
      "Escalation isn't a failure — knowing when a situation needs a different owner than the one who first touched it is itself a skill."
    ];
    const insight = insights[(s1Correct+s2Correct+primaryHits) % insights.length];
    panel.appendChild(el('div','insight-banner', `💡 ${insight}`));

    const replayRow = el('div','replay-row');
    const replayBtn = el('button','btn btn-ghost','↻ Run the simulation again');
    replayRow.appendChild(replayBtn);
    panel.appendChild(replayRow);

    replayBtn.addEventListener('click', ()=>{
      state = {
        stage:1, stage1Idx:0, stage2Idx:0, stage3Idx:0,
        stage1Answers:[], stage2Answers:[], stage3Answers:[],
        scores:{ownership:0, delegation:0, collaboration:0, workflow:0}
      };
      fullRerender();
    });

    celebrate();

    return panel;
  }

  function celebrate(){
    const wrap = el('div','celebrate-wrap');
    document.body.appendChild(wrap);
    const colors = ['#5eead4','#f0b429','#a78bfa','#fb7185','#34d399'];
    for(let i=0;i<40;i++){
      const c = el('div','confetti');
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[i%colors.length];
      c.style.animationDuration = (2.5+Math.random()*1.8)+'s';
      c.style.animationDelay = (Math.random()*0.4)+'s';
      wrap.appendChild(c);
    }
    setTimeout(()=>{ wrap.remove(); }, 5000);
  }

  /* ============================ INIT ============================ */

  fullRerender();

})();
</script>
</body>
</html>
